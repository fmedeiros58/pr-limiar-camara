name: Deploy ACERVO to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public allowlist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/administracao/ferramentas
          cp index.html camara.html camara-dados.js acervo.html portal.html configuracao.json matriz-livro.json matriz-playfair.json _site/
          cp administracao/ferramentas/acervo-crypto.js _site/administracao/ferramentas/
          if [ -d acervo-criptografado/conteudos ]; then cp -R acervo-criptografado/conteudos _site/acervo; fi
      - name: Upload public site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

