<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PORTAL · Atalhos</title>
  <style>
    :root{color-scheme:dark;--bg:#101410;--panel:#1d261e;--gold:#d6bd87;--text:#f3eee4;--muted:#bbc3b5;--line:#4c5a4c}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#2c3b2e,#101410 55rem);color:var(--text);font:16px/1.55 Georgia,serif}.shell{width:min(850px,calc(100% - 32px));margin:70px auto}.eyebrow{font:11px Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}h1{font-size:clamp(42px,8vw,82px);font-weight:400;line-height:1;margin:18px 0 10px}.note{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:34px}.card{display:block;padding:24px 18px;background:rgba(29,38,30,.94);border:1px solid var(--line);color:var(--text);text-decoration:none;min-height:170px}.card:hover{border-color:var(--gold);transform:translateY(-2px)}.card strong{display:block;color:var(--gold);font-size:24px;font-weight:400;margin:15px 0 8px}.card span{color:var(--muted);font:13px Arial,sans-serif}@media(max-width:700px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="eyebrow">Ambiente local · OneDrive</div>
    <h1>PORTAL</h1>
    <p class="note">Escolha o ambiente que deseja abrir.</p>
    <div class="grid">
      <a class="card" href="camara.html"><div class="eyebrow">01</div><strong>Câmara</strong><span>Resolver o desafio de decifração.</span></a>
      <a class="card" href="portal.html"><div class="eyebrow">02</div><strong>Portal</strong><span>Administrar publicações e arquivos protegidos.</span></a>
      <a class="card" href="acervo.html"><div class="eyebrow">03</div><strong>Acervo</strong><span>Acessar o ambiente de leitura.</span></a>
    </div>
  </main>
</body>
</html>
